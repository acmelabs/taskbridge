name: Release to Maven Central

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Set release version
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.value }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Deploy to Maven Central
        run: mvn --batch-mode deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          TAG=${{ steps.version.outputs.tag }}
          gh release create ${TAG} \
            --title "Release ${TAG}" \
            --generate-notes \
            taskbridge-server/target/taskbridge-server-${VERSION}.jar \
            taskbridge-server/target/taskbridge-server-${VERSION}-sources.jar \
            taskbridge-server/target/taskbridge-server-${VERSION}-javadoc.jar \
            taskbridge-client/target/taskbridge-client-${VERSION}.jar \
            taskbridge-client/target/taskbridge-client-${VERSION}-sources.jar \
            taskbridge-client/target/taskbridge-client-${VERSION}-javadoc.jar

  bump-version:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compute next SNAPSHOT version
        id: next
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          echo "version=${MAJOR}.$((MINOR + 1)).0-SNAPSHOT" >> $GITHUB_OUTPUT

      - name: Bump to next SNAPSHOT
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.next.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version to ${{ steps.next.outputs.version }}"
          git push
